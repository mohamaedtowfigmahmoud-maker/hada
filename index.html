<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>فلترة العملاء</title>
  
  <style>
    /* ----- التنسيق العام (CSS) ----- */
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }

    body {
      background: linear-gradient(135deg, #0f172a 0%, #1e293b 100%);
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px;
    }

    .card {
      background: #ffffff;
      width: 100%;
      max-width: 420px;
      padding: 30px;
      border-radius: 16px;
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.2);
      text-align: center;
    }

    .card h2 {
      color: #0f172a;
      margin-bottom: 24px;
      font-size: 1.6rem;
      font-weight: 700;
    }

    .input-group {
      margin-bottom: 20px;
    }

    .input-group input {
      width: 100%;
      padding: 12px 16px;
      border: 2px solid #e2e8f0;
      border-radius: 10px;
      font-size: 1rem;
      outline: none;
      transition: border-color 0.3s ease;
    }

    .input-group input:focus {
      border-color: #3b82f6;
    }

    .button-group {
      display: flex;
      gap: 12px;
      margin-bottom: 20px;
    }

    .btn {
      flex: 1;
      padding: 12px 10px;
      border: none;
      border-radius: 10px;
      font-size: 0.95rem;
      font-weight: 600;
      cursor: pointer;
      transition: transform 0.2s ease, opacity 0.2s ease;
    }

    .btn:active {
      transform: scale(0.98);
    }

    .btn-add {
      background-color: #10b981;
      color: white;
    }

    .btn-add:hover {
      opacity: 0.9;
    }

    .btn-search {
      background-color: #3b82f6;
      color: white;
    }

    .btn-search:hover {
      opacity: 0.9;
    }

    /* منطقة التنبيهات */
    .alert {
      padding: 12px;
      border-radius: 8px;
      font-size: 0.9rem;
      font-weight: 600;
      display: none;
    }

    .alert.success {
      background-color: #d1fae5;
      color: #065f46;
    }

    .alert.error {
      background-color: #fee2e2;
      color: #991b1b;
    }

    /* القائمة المخفية بشكل دائم */
    .hidden-list {
      display: none !important;
    }
  </style>
</head>
<body>

  <!-- ----- هيكل الصفحة (HTML) ----- -->
  <div class="card">
    <h2>فلترة العملاء</h2>

    <!-- حقل الإدخال -->
    <div class="input-group">
      <input type="text" id="customerName" placeholder="أدخل اسم العميل..." autocomplete="off">
    </div>

    <!-- أزرار العمليات -->
    <div class="button-group">
      <button id="addBtn" class="btn btn-add">إضافة عميل</button>
      <button id="searchBtn" class="btn btn-search">بحث عن عميل</button>
    </div>

    <!-- منطقة الرسائل والتنبيهات -->
    <div id="alertBox" class="alert"></div>

    <!-- القائمة المخفية لتخزين الأسماء -->
    <ul id="hiddenCustomerList" class="hidden-list"></ul>
  </div>

  <!-- ----- البرمجة والتفاعل (JavaScript) ----- -->
  <script>
    // جلب العناصر من الـ DOM
    const customerInput = document.getElementById('customerName');
    const addBtn = document.getElementById('addBtn');
    const searchBtn = document.getElementById('searchBtn');
    const hiddenList = document.getElementById('hiddenCustomerList');
    const alertBox = document.getElementById('alertBox');

    // المفتاح المستخدم للتخزين في LocalStorage
    const STORAGE_KEY = 'customers_list';

    // دالة لعرض التنبيهات
    function showAlert(message, type) {
      alertBox.textContent = message;
      alertBox.className = `alert ${type}`;
      alertBox.style.display = 'block';
    }

    // دالة لحفظ القائمة الحالية من الـ DOM إلى LocalStorage
    function saveToLocalStorage() {
      const listItems = Array.from(hiddenList.querySelectorAll('li'));
      const names = listItems.map(item => item.textContent.trim());
      localStorage.setItem(STORAGE_KEY, JSON.stringify(names));
    }

    // دالة لتحميل الأسماء المخزنة من LocalStorage عند فتح/تحديث الصفحة
    function loadFromLocalStorage() {
      const storedNames = localStorage.getItem(STORAGE_KEY);
      if (storedNames) {
        const names = JSON.parse(storedNames);
        names.forEach(name => {
          const li = document.createElement('li');
          li.textContent = name;
          hiddenList.appendChild(li);
        });
      }
    }

    // 1. إضافة عميل جديد
    addBtn.addEventListener('click', () => {
      const name = customerInput.value.trim();

      if (name === '') {
        showAlert('يرجى كتابة اسم العميل أولاً!', 'error');
        return;
      }

      // إنشاء عنصر <li> وتخزينه في القائمة المخفية
      const li = document.createElement('li');
      li.textContent = name;
      hiddenList.appendChild(li);

      // تحديث البيانات في LocalStorage
      saveToLocalStorage();

      // إظهار رسالة تأكيد وإعادة ضبط حقل الإدخال
      showAlert(`تمت إضافة العميل "${name}" وحفظه بنجاح.`, 'success');
      customerInput.value = '';
      customerInput.focus();
    });

    // 2. البحث عن عميل
    searchBtn.addEventListener('click', () => {
      const query = customerInput.value.trim().toLowerCase();

      if (query === '') {
        showAlert('يرجى كتابة الاسم المراد البحث عنه!', 'error');
        return;
      }

      // جلب العناصر المخزنة في القائمة المخفية بالـ DOM
      const listItems = Array.from(hiddenList.querySelectorAll('li'));
      const found = listItems.some(item => item.textContent.trim().toLowerCase() === query);

      if (found) {
        showAlert(`العميل "${customerInput.value.trim()}" موجود في القائمة!`, 'success');
      } else {
        showAlert(`عذراً، الاسم "${customerInput.value.trim()}" غير موجود.`, 'error');
      }
    });

    // استرجاع القائمة فور تحميل الصفحة
    document.addEventListener('DOMContentLoaded', loadFromLocalStorage);
  </script>
</body>
</html>
